<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saturn-like Gas Giant</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';

try {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x030308, 1);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6.5);
  camera.lookAt(0, 0, 0);

  // Light from upper-left
  const lightDir = new THREE.Vector3(-0.65, 0.55, 0.52).normalize();
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
  sun.position.copy(lightDir).multiplyScalar(10);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x334455, 0.35));

  // Tilted system group: view rings ~20 deg above edge-on
  const system = new THREE.Group();
  system.rotation.x = -0.36;
  system.rotation.z = 0.05;
  scene.add(system);

  // ---------- Planet texture ----------
  function makePlanetTexture() {
    const w = 1024, h = 512;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    // vertical gradient = horizontal bands
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0.00, '#c99a5b');
    grad.addColorStop(0.12, '#e6c88f');
    grad.addColorStop(0.28, '#f3e6c4');
    grad.addColorStop(0.42, '#eedaA8'.toLowerCase());
    grad.addColorStop(0.50, '#f6ecd0');   // lighter equatorial zone
    grad.addColorStop(0.58, '#eedaa8');
    grad.addColorStop(0.72, '#e6c88f');
    grad.addColorStop(0.86, '#d8b078');
    grad.addColorStop(1.00, '#c99a5b');
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);

    // faint darker belts
    g.globalAlpha = 0.18;
    g.fillStyle = '#a87c46';
    [[0.20, 0.05], [0.34, 0.03], [0.63, 0.04], [0.78, 0.06]].forEach(([y, hh]) => {
      g.fillRect(0, y * h, w, hh * h);
    });
    g.globalAlpha = 1;

    // subtle swirls / streaks
    for (let i = 0; i < 90; i++) {
      const y = Math.random() * h;
      const len = 40 + Math.random() * 160;
      const x = Math.random() * w;
      g.strokeStyle = Math.random() < 0.5 ? 'rgba(255,244,214,0.10)' : 'rgba(150,105,60,0.10)';
      g.lineWidth = 1 + Math.random() * 3;
      g.beginPath();
      g.moveTo(x, y);
      g.bezierCurveTo(x + len * 0.3, y + (Math.random() - 0.5) * 8,
                      x + len * 0.7, y + (Math.random() - 0.5) * 8,
                      x + len, y);
      g.stroke();
    }

    // faint storm oval
    g.save();
    g.translate(w * 0.62, h * 0.60);
    g.rotate(-0.08);
    g.scale(2.2, 1);
    const sg = g.createRadialGradient(0, 0, 2, 0, 0, 26);
    sg.addColorStop(0, 'rgba(190,130,80,0.85)');
    sg.addColorStop(0.6, 'rgba(200,145,95,0.45)');
    sg.addColorStop(1, 'rgba(200,145,95,0)');
    g.fillStyle = sg;
    g.beginPath(); g.arc(0, 0, 26, 0, Math.PI * 2); g.fill();
    g.restore();

    // small white spot
    g.save();
    g.translate(w * 0.25, h * 0.38);
    g.scale(1.8, 1);
    const wg = g.createRadialGradient(0, 0, 1, 0, 0, 12);
    wg.addColorStop(0, 'rgba(255,250,235,0.7)');
    wg.addColorStop(1, 'rgba(255,250,235,0)');
    g.fillStyle = wg;
    g.beginPath(); g.arc(0, 0, 12, 0, Math.PI * 2); g.fill();
    g.restore();

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  }

  const planetTex = makePlanetTexture();
  const planetMat = new THREE.MeshStandardMaterial({
    map: planetTex,
    roughness: 0.9,
    metalness: 0.0
  });
  const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), planetMat);
  system.add(planet);

  // ---------- Fake ring-shadow band on planet (shadow side only) ----------
  const shadowBandMat = new THREE.ShaderMaterial({
    uniforms: {
      uLight: { value: lightDir.clone() }
    },
    vertexShader: `
      varying vec3 vNObj; varying vec3 vNWorld;
      void main(){
        vNObj = normalize(normal);
        vNWorld = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 uLight;
      varying vec3 vNObj; varying vec3 vNWorld;
      void main(){
        float band = 1.0 - smoothstep(0.02, 0.16, abs(vNObj.y));
        float shade = smoothstep(0.15, -0.25, dot(vNWorld, uLight));
        float a = band * shade * 0.55;
        gl_FragColor = vec4(vec3(0.02,0.015,0.01), a);
      }`,
    transparent: true, depthWrite: false
  });
  system.add(new THREE.Mesh(new THREE.SphereGeometry(1.004, 48, 32), shadowBandMat));

  // ---------- Rings (custom shader: radial structure, gap, differential orbit, planet shadow) ----------
  const R_IN = 1.32, R_OUT = 2.2;
  const ringGeo = new THREE.RingGeometry(R_IN, R_OUT, 180, 8);
  const ringUniforms = {
    uTime: { value: 0 },
    uLight: { value: lightDir.clone() },
    uCamPos: { value: new THREE.Vector3() }
  };
  const ringMat = new THREE.ShaderMaterial({
    uniforms: ringUniforms,
    vertexShader: `
      varying vec3 vPos; varying vec3 vWorld;
      void main(){
        vPos = position;
        vWorld = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform float uTime; uniform vec3 uLight; uniform vec3 uCamPos;
      varying vec3 vPos; varying vec3 vWorld;
      void main(){
        float r = length(vPos.xy);
        float t = clamp((r - ${R_IN.toFixed(3)}) / (${(R_OUT - R_IN).toFixed(3)}), 0.0, 1.0);
        float th = atan(vPos.y, vPos.x);

        // radial banding (pale icy tan)
        float b = 0.5 + 0.5 * sin(t * 46.0 + sin(t * 13.0) * 2.0);
        b *= 0.5 + 0.5 * sin(t * 17.0 - 1.3);
        vec3 colA = vec3(0.96, 0.90, 0.76);   // pale icy tan
        vec3 colB = vec3(0.82, 0.72, 0.56);   // darker tan
        vec3 col = mix(colB, colA, 0.45 + 0.55 * b);

        // brightness clumps orbiting in-plane (differential: faster inside)
        float speed = mix(26.0, 15.0, t) * 0.01745; // deg/s -> rad/s
        float clump = 0.88 + 0.12 * sin(th * 5.0 - uTime * speed)
                              + 0.07 * sin(th * 11.0 - uTime * speed * 1.4 + 2.0);
        col *= clump;

        // Cassini-style gap ~2/3 out
        float gapC = 0.66;
        float gap = smoothstep(0.045, 0.012, abs(t - gapC));
        float alpha = 0.92 * gap;

        // edge fades
        alpha *= smoothstep(0.0, 0.10, t) * (1.0 - smoothstep(0.86, 1.0, t));
        // inner region slightly more translucent
        alpha *= mix(0.55, 1.0, smoothstep(0.0, 0.35, t));

        // planet shadow on rings: behind planet relative to light
        vec3 toP = vWorld; // planet at origin
        float along = dot(toP, uLight);
        vec3 perp = toP - uLight * along;
        float inShadow = step(along, 0.0) * (1.0 - smoothstep(0.85, 1.0, length(perp)));
        col *= mix(1.0, 0.18, inShadow);

        // overall lit-side bias (near/left brighter)
        float lit = 0.72 + 0.28 * clamp(dot(normalize(vec3(-vPos.x, vPos.y * 0.4, 0.6)), uLight) * 0.5 + 0.5, 0.0, 1.0);
        col *= lit;

        gl_FragColor = vec4(col, alpha);
      }`,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const rings = new THREE.Mesh(ringGeo, ringMat);
  system.add(rings);

  // ---------- Starfield ----------
  const starCount = 700;
  const sPos = new Float32Array(starCount * 3);
  const sCol = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(40 + Math.random() * 20);
    sPos.set([v.x, v.y, v.z], i * 3);
    const m = 0.25 + Math.random() * 0.55;
    sCol.set([m, m, m * (0.95 + Math.random() * 0.1)], i * 3);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 0.09, vertexColors: true, sizeAttenuation: true,
    transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(stars);

  // ---------- Animation loop (timestamp-driven) ----------
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // planet spin ~25 deg/s
    planet.rotation.y = t * 25 * Math.PI / 180;
    planetTex.offset.x = -(t * 25 / 360) % 1; // extra drift safety (redundant but harmless)

    ringUniforms.uTime.value = t;
    ringUniforms.uCamPos.value.copy(camera.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
} catch (e) {
  console.error(e);
}
</script>
</body>
</html>
